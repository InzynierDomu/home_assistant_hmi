; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
src_dir = src
boards_dir = .

[env:esp32-s3-devkitc-1-myboard]
; Przypięta wersja oficjalnego Espressif platform (nie pioarduino fork).
; Wymagane bo pioarduino (espressif32@55+) nie jest kompatybilny z framework arduino-esp32@2.0.3.
platform = espressif32@7.0.1
board = esp32-s3-devkitc-1-myboard
framework = arduino
platform_packages = framework-arduinoespressif32 @ https://github.com/espressif/arduino-esp32#2.0.3
build_unflags =
    -std=gnu++11
build_flags =
	-D LV_LVGL_H_INCLUDE_SIMPLE
	-I./include
	-std=gnu++14
lib_deps =
	lvgl/lvgl@8.3.6
	tamctec/TAMC_GT911@^1.0.2
	lovyan03/LovyanGFX@^1.1.12
	bblanchon/ArduinoJson@^7.0.0

board_build.partitions = huge_app.csv
monitor_speed = 115200
monitor_filters = time
